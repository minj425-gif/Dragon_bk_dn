name: dragon_bk_dn

on:
  schedule:
    - cron: "0 21-23,0-15 * * *"
  workflow_dispatch:          # 수동 실행 버튼 사용 가능

permissions:
  contents: write             # 확인한 상영시간 기록을 저장하기 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 상영시간 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python cgv_alert.py

      - name: 기록 저장
        run: |
          git config user.name "cgv-bot"
          git config user.email "cgv-bot@users.noreply.github.com"
          if [ -f seen_showtimes.json ]; then
            git add seen_showtimes.json
            git diff --staged --quiet || (git commit -m "update seen showtimes" && git push)
          fi
